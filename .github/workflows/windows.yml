name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cryptography
        run: python -m pip install cryptography

      - name: Test install, the scheduled task, an update under Chrome and uninstall
        env:
          UBO_OUT: ${{ runner.temp }}\ubo-lpa-windows-results
        run: python tests/windows/run.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\ubo-lpa-windows-results
          if-no-files-found: warn
          retention-days: 14
