name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cryptography, and pywinauto and Pillow for the test
        run: python -m pip install cryptography pywinauto pillow

      - name: Test install, the scheduled task, load, an update while Chrome runs, and uninstall
        env:
          UBO_OUT: ${{ runner.temp }}\ubo-lpa-windows-results
        run: python tests/windows/run.py

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\ubo-lpa-windows-results
          if-no-files-found: warn
          retention-days: 14

  msi:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Parse install.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Out-String | Write-Host; exit 1 }

      - name: Install WiX, and Pillow for the art and pywinauto for the test
        shell: pwsh
        run: |
          python -m pip install pillow pywinauto
          dotnet tool install --global wix --version "6.*"
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $version = (& "$env:USERPROFILE\.dotnet\tools\wix.exe" --version) -replace '\+.*', ''
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g "WixToolset.UI.wixext/$version"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g "WixToolset.Util.wixext/$version"

      - name: Build the MSI, and a newer one for the upgrade test
        env:
          # Authenticates the lookup of the uBO release to bundle.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python windows/msi/build.py --version 1.0.${{ github.run_number }} --out dist
          python windows/msi/build.py --version 1.1.${{ github.run_number }} --out upgrade

      - name: Install through the wizard, upgrade and uninstall
        env:
          UBO_OUT: ${{ runner.temp }}\ubo-lpa-msi-results
        run: python tests/windows/msi_test.py dist/ubo-lpa-1.0.${{ github.run_number }}.msi upgrade/ubo-lpa-1.1.${{ github.run_number }}.msi

      - name: Upload the MSI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubo-lpa-msi-${{ github.run_number }}
          path: dist/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\ubo-lpa-msi-results
          if-no-files-found: warn
          retention-days: 14

  publish:
    # The README's download link and install.ps1 fetch the MSI from the
    # "latest" release. It is replaced only from main, and only after both
    # Windows jobs passed on that commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [installer, msi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the tested MSI
        uses: actions/download-artifact@v8
        with:
          name: ubo-lpa-msi-${{ github.run_number }}
          path: dist

      - name: Download the msi job's screenshots of the setup
        uses: actions/download-artifact@v8
        with:
          name: msi-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: shots

      - name: Publish the MSI as the latest release, and the setup screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "dist/ubo-lpa-1.0.${{ github.run_number }}.msi" ubo-lpa.msi
          move_tag() {
            if gh api "repos/$REPO/git/refs/tags/$1" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$REPO/git/refs/tags/$1" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api "repos/$REPO/git/refs" -f ref="refs/tags/$1" -f sha="$GITHUB_SHA" >/dev/null
            fi
          }
          move_tag latest
          move_tag screenshots

          # The screenshots live in their own pre-release, so the latest
          # release lists only the MSI; its notes and the README show them
          # from there, under names that stay the same from build to build.
          chrome=$(cat shots/chrome.txt 2>/dev/null || echo "Google Chrome")
          base="https://github.com/$REPO/releases/download/screenshots"
          gallery=""
          uploads=()
          while IFS='|' read -r from to caption; do
            [ -n "$from" ] || continue
            if [ -f "shots/$from" ]; then
              cp "shots/$from" "$to"
              uploads+=("$to")
              gallery+="**$caption**"$'\n\n'"![$caption]($base/$to)"$'\n\n'
            else
              echo "::warning::the msi job did not produce $from"
            fi
          done <<EOF
          wizard-1-welcome.png|setup-1-welcome.png|Welcome
          wizard-2-release.png|setup-2-release.png|The uBlock Origin release: the newest one on GitHub, or the one bundled with the installer
          wizard-3-chrome.png|setup-3-chrome.png|Setup found $chrome. Manifest V2 extensions no longer run in this Chrome; the profiles ticked here get uBlock Origin
          wizard-4-options.png|setup-4-options.png|The folder, and a full installation with update checks or a portable one
          wizard-5-ready.png|setup-5-ready.png|Ready to install
          wizard-6-progress.png|setup-6-progress.png|Installing
          consent-1.png|setup-7-chrome-prompt.png|Chrome asks whether to allow remote debugging; Allow is the only click Setup needs in Chrome
          wizard-7-finish.png|setup-8-finish.png|Finished
          desktop-after-install.png|setup-9-chrome.png|uBlock Origin's panel on adblock-tester.com, opened from its pinned toolbar button
          maintenance-change-1-maintenance.png|setup-10-maintenance.png|The Start menu entry opens the maintenance page: Update now, Change settings or Remove
          portable-3-options.png|setup-11-portable.png|A portable installation leaves nothing but the folder
          extensions-page.png|load-by-hand.png|Chrome's extensions page after loading by hand: Developer mode on, Load unpacked, and both extensions
          EOF

          if ! gh release view screenshots -R "$REPO" >/dev/null 2>&1; then
            gh release create screenshots -R "$REPO" --prerelease --title "Setup screenshots" \
              --notes "Screenshots of the Windows setup, taken by the msi job on a Windows runner. The README and the latest release show them from here."
          fi
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload screenshots -R "$REPO" "${uploads[@]}" --clobber
          fi

          notes="ubo-lpa.msi version 1.0.${{ github.run_number }}, built from $GITHUB_SHA and tested by the Windows workflow.

          It installs ubo-lpa for the current user without administrator rights. The wizard asks which uBlock Origin release to install (the newest one or the one bundled with the MSI), which Chrome profiles get it, and whether to update it daily. An install without maintenance leaves nothing but the uBlock Origin folder. To download and start it from PowerShell:

              irm https://raw.githubusercontent.com/$REPO/main/install.ps1 | iex

          The MSI is not code-signed, so Windows SmartScreen warns about it.

          ## Screenshots of Setup, taken by the msi job on a Windows runner

          $gallery"
          if gh release view latest -R "$REPO" >/dev/null 2>&1; then
            gh release edit latest -R "$REPO" --notes "$notes" --latest
          else
            gh release create latest -R "$REPO" --title "ubo-lpa for Windows" \
              --notes "$notes" --latest
          fi
          gh release upload latest -R "$REPO" ubo-lpa.msi --clobber
          # Delete every asset but the MSI, such as the screenshots that
          # earlier builds uploaded here.
          for asset in $(gh release view latest -R "$REPO" --json assets -q '.assets[].name'); do
            if [ "$asset" != ubo-lpa.msi ]; then
              gh release delete-asset latest "$asset" -R "$REPO" -y
            fi
          done

      - name: Check that the public link serves this MSI
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/latest/download/ubo-lpa.msi"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL -o public.msi "$url" && cmp -s public.msi ubo-lpa.msi; then
              echo "$url serves version 1.0.${{ github.run_number }}"
              exit 0
            fi
            sleep 10
          done
          echo "$url does not serve the MSI just uploaded" >&2
          exit 1
