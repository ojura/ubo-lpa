name: Windows Chrome under Wine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wine-chrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run static and diagnostics-contract checks
        run: |
          python3 -m py_compile ubo-lpa.py tests/e2e/probe.py
          python3 tests/e2e/test_probe_diagnostics.py
          bash -n tests/e2e/setup-ubo-wine-harness.sh

      - name: Install current WineHQ development build
        run: |
          sudo dpkg --add-architecture i386
          curl -fsSL --retry 4 \
            https://dl.winehq.org/wine-builds/winehq.key \
            -o "$RUNNER_TEMP/winehq.key"
          curl -fsSL --retry 4 \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources \
            -o "$RUNNER_TEMP/winehq-noble.sources"
          sudo install -D -m 0644 "$RUNNER_TEMP/winehq.key" \
            /etc/apt/keyrings/winehq-archive.key
          sudo install -D -m 0644 "$RUNNER_TEMP/winehq-noble.sources" \
            /etc/apt/sources.list.d/winehq-noble.sources
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --install-recommends winehq-devel
          version=$(/opt/wine-devel/bin/wine --version)
          major=${version#wine-}
          major=${major%%.*}
          test "$major" -ge 11
          printf '%s\n' "$version"

      - name: Exercise Windows Chrome through Wine
        env:
          WINE_BIN: /opt/wine-devel/bin/wine
          WINE_TCP_SHIM: always
          UBO_RELEASE_VERSION: 1.74.0
        run: |
          tests/e2e/setup-ubo-wine-harness.sh \
            --out "$RUNNER_TEMP/ubo-lpa-wine-results" \
            "$GITHUB_WORKSPACE"

      - name: Record runner environment
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ubo-lpa-wine-results/logs"
          {
            uname -a
            python3 --version
            /opt/wine-devel/bin/wine --version || true
          } > "$RUNNER_TEMP/ubo-lpa-wine-results/logs/runner-environment.txt"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-chrome-wine-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ubo-lpa-wine-results/
          if-no-files-found: warn
          retention-days: 14
