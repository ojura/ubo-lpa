<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/* An iframe with no width defaults to 300px, which Chrome would then use as the
   popup width; the body must shrink-wrap too or it keeps that width after the
   iframe is resized. 252px = uBO's --popup-main-min-width (18em at 14px). */
html,body{margin:0;padding:0;overflow:hidden;width:max-content}
iframe{border:0;display:block;width:252px;height:400px}
</style>
</head><body>
<iframe id="ubo" scrolling="no"></iframe>
<script src="popup.js"></script>
</body></html>
